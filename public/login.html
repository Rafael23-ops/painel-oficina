<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Oficina</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #070b10;
            color: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 360px;
            background: #0d131a;
            border: 1px solid #202b36;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,.45);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .sotreq {
            display: inline-block;
            background: #f8c51c;
            color: #111;
            padding: 8px 12px;
            font-size: 20px;
            font-weight: 900;
        }

        .cat {
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            margin-left: 6px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-top: 15px;
        }

        .subtitulo {
            text-align: center;
            color: #8793a0;
            font-size: 12px;
            margin-top: 5px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #303c49;
            background: #111923;
            color: #fff;
            outline: none;
        }

        input:focus {
            border-color: #2583f7;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #2583f7;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1475eb;
        }

        #erro {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #3a1518;
            border: 1px solid #e51b23;
            color: #ff6970;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <span class="sotreq">Sotreq</span>
        <span class="cat">CAT</span>

        <h1>🔧 OFICINA 🔧</h1>
        <div class="subtitulo">
            Sistema de Ordens de Manutenção
        </div>
    </div>

    <form id="formLogin">

        <label for="usuario">Usuário</label>
        <input
            type="text"
            id="usuario"
            autocomplete="username"
            placeholder="Digite seu usuário"
            required
        >

        <label for="senha">Senha</label>
        <input
            type="password"
            id="senha"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
        >

        <button type="submit">
            ENTRAR
        </button>

        <div id="erro"></div>

    </form>

</div>

<script>

document.getElementById("formLogin").addEventListener("submit", async function(e) {

    e.preventDefault();

    const usuario = document.getElementById("usuario").value;
    const senha = document.getElementById("senha").value;
    const erro = document.getElementById("erro");

    erro.style.display = "none";

    try {

        const resposta = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                usuario: usuario,
                senha: senha
            })
        });

        const dados = await resposta.json();

        if (!resposta.ok || !dados.sucesso) {

            erro.textContent = dados.erro || "Usuário ou senha incorretos.";
            erro.style.display = "block";

            return;
        }

        window.location.href = "/";

    } catch (err) {

        erro.textContent = "Não foi possível conectar ao servidor.";
        erro.style.display = "block";

    }

});

</script>

</body>
</html>
